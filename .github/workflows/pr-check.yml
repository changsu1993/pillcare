# PR Validation Workflow
# Runs on all pull requests to validate code quality

name: PR Check

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  expo-doctor:
    name: Expo Doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor
        run: npx expo-doctor
        continue-on-error: true

  # Fingerprint check to detect native changes
  fingerprint:
    name: Check Native Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for native changes
        id: fingerprint
        run: |
          # Files that indicate native changes requiring new binary build
          NATIVE_FILES=(
            "app.json"
            "eas.json"
            "package.json"
            "package-lock.json"
          )

          NATIVE_CHANGED=false
          for file in "${NATIVE_FILES[@]}"; do
            if git diff origin/main --name-only | grep -q "^$file$"; then
              echo "Native file changed: $file"
              NATIVE_CHANGED=true
            fi
          done

          echo "native_changed=$NATIVE_CHANGED" >> $GITHUB_OUTPUT

      - name: Comment on PR if native changes detected
        if: steps.fingerprint.outputs.native_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Native Changes Detected

            This PR contains changes to native configuration files. A new binary build will be required before these changes take effect.

            **Affected areas may include:**
            - App permissions
            - Native modules/plugins
            - Build configuration
            - Version numbers

            **Note:** OTA updates cannot deploy these changes. You must create a new build and submit to app stores.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
